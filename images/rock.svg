<svg
        width="64"
        height="48"
        viewBox="0 0 64 48"
        xmlns="http://www.w3.org/2000/svg"
        shape-rendering="crispEdges">
        <!-- transparent background by default -->
        <rect x="0" y="0" width="64" height="48" fill="none" />
        <!-- rock base -->
        <rect x="10" y="26" width="40" height="14" fill="#6b727c" />
        <rect x="14" y="22" width="32" height="8" fill="#747b85" />
        <rect x="18" y="18" width="22" height="6" fill="#808894" />
        <!-- light edge -->
        <rect x="18" y="20" width="18" height="2" fill="#9098a5" />
        <rect x="14" y="24" width="12" height="2" fill="#828a96" />
        <!-- darker shadow side -->
        <rect x="32" y="24" width="14" height="10" fill="#5c636e" />
      </svg>