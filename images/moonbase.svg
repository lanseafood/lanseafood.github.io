<svg
  width="240"
  height="140"
  viewBox="0 0 240 140"
  xmlns="http://www.w3.org/2000/svg"
  shape-rendering="crispEdges">

  <!-- Dome -->
  <g transform="translate(80,10)">
    <rect x="0" y="60" width="120" height="40" fill="#7a828d"/>
    <rect x="10" y="52" width="100" height="8" fill="#7a828d"/>
    <rect x="18" y="44" width="84" height="8" fill="#747c87"/>
    <rect x="26" y="36" width="68" height="8" fill="#6f7782"/>
    <rect x="34" y="28" width="52" height="8" fill="#696f7b"/>

    <!-- Dome highlight -->
    <rect x="42" y="44" width="36" height="8" fill="#aeb6c3"/>
    <rect x="36" y="52" width="48" height="8" fill="#a3aabd"/>
  </g>

  <!-- Tunnel -->
  <g transform="translate(20,50)">
    <!-- Body -->
    <rect x="0" y="12" width="100" height="60" fill="#6e7681"/>
    <rect x="6" y="18" width="88" height="48" fill="#7c848f"/>

    <!-- Vertical divisions -->
    <rect x="18" y="18" width="3" height="48" fill="#5e6470"/>
    <rect x="34" y="18" width="3" height="48" fill="#5e6470"/>
    <rect x="50" y="18" width="3" height="48" fill="#5e6470"/>
    <rect x="66" y="18" width="3" height="48" fill="#5e6470"/>

    <!-- Front cap -->
    <rect x="-26" y="6" width="30" height="64" fill="#747c87"/>
    <rect x="-22" y="12" width="22" height="52" fill="#8c94a0"/>

    <!-- Door ribs -->
    <rect x="-14" y="18" width="3" height="40" fill="#676f7a"/>
    <rect x="-18" y="18" width="3" height="40" fill="#5b636f"/>

    <!-- Handle -->
    <rect x="-8" y="32" width="3" height="6" fill="#5b636f"/>
  </g>

</svg>
